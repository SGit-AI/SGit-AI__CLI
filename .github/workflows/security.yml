name: Security

# The security gates on a pull request, before anything reaches dev or main (the release
# pipeline in ci-pipeline.yml runs on push and keeps its own security-tests job, which gates
# publishing). Weekly, the same scans run on dev so a new advisory or a new Semgrep rule shows
# up even when the code has not changed. Each gate fails only on what is new: Bandit against
# a committed baseline, Semgrep on the lines the change touches, zizmor with reviewed ignores
# (.github/zizmor.yml), pip-audit on any advisory. The AI review is opt-in and paid; see
# team/humans/dinis_cruz/claude-code-web/10/13/security-ci__pipeline-and-ai-review.md.

on:
  pull_request:
    branches: [dev, main]
  schedule:
    - cron: '17 5 * * 1'                     # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-tests:
    name: "Security & adversarial tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: pip install -e . pytest
      - run: python -m pytest tests/security -q

  static-analysis:
    name: "Bandit (baseline) and Semgrep (new lines)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0                       # Semgrep compares against the base commit
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: pip install --quiet "bandit==1.9.4" "semgrep==1.178.0"
      - name: Bandit against tests/security/bandit-baseline.json
        run: bandit -r sgit_ai -b tests/security/bandit-baseline.json -q
      - name: Semgrep
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SEMGREP_SEND_METRICS: "off"
        run: |
          RULES="--config p/python --config p/security-audit --config p/secrets --config r/python.cryptography"
          if [ -n "$BASE_SHA" ]; then
            # a pull request: fail only on findings in lines this change adds or moves
            semgrep scan $RULES --baseline-commit "$BASE_SHA" --error --metrics off sgit_ai review/tools
          else
            # the weekly run: everything, as a report (new rules arrive with the registry)
            semgrep scan $RULES --metrics off --sarif --output semgrep.sarif sgit_ai review/tools || true
          fi
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: ignore

  dependency-audit:
    name: "pip-audit (runtime dependencies)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: pip install --quiet "pip-audit==2.10.1"
      - name: Audit what pyproject.toml lets a user install
        run: |
          python - > runtime-deps.txt <<'EOF'
          import tomllib
          deps = tomllib.load(open('pyproject.toml', 'rb'))['tool']['poetry']['dependencies']
          print('\n'.join(f'{name}{spec}' for name, spec in deps.items() if name != 'python'))
          EOF
          cat runtime-deps.txt
          pip-audit -r runtime-deps.txt --strict --progress-spinner off

  workflow-audit:
    name: "actionlint and zizmor (GitHub Actions)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: pip install --quiet "zizmor==1.30.1" "actionlint-py==1.7.12.25"
      # actionlint first: GitHub rejects an invalid workflow before any job runs (a duplicated
      # `with:` passed every YAML parser here and failed dev on 13 Oct); zizmor for security.
      - run: actionlint -shellcheck= .github/workflows/*.yml
      - run: zizmor --offline --min-severity medium --format github .github/

  review-graph:
    name: "review/ graph is current"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: derive.py --check (a warning, not a gate)
        run: |
          python3 review/tools/derive.py --check || \
            echo "::warning::review/graph is stale: run python3 review/tools/derive.py and commit review/graph"

  ai-review:
    name: "AI security review (opt-in)"
    # Runs only when the repository variable SECURITY_AI_REVIEW is 'true' (and the secret
    # ANTHROPIC_API_KEY is set), only for branches of this repository (a fork's PR never gets
    # the key), and only reviews files of the security slice (review/slice.json).
    if: >-
      github.event_name == 'pull_request' &&
      vars.SECURITY_AI_REVIEW == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: pip install --quiet "anthropic==1.9.0"
      - name: Review the change
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MODEL: ${{ vars.SECURITY_AI_REVIEW_MODEL || 'claude-sonnet-5-5' }}
        run: |
          python3 review/tools/ai_review.py --base "$BASE_SHA" --head "$HEAD_SHA" \
            --model "$MODEL" --out ai-review.json
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ai-review
          path: ai-review.json
          if-no-files-found: ignore
