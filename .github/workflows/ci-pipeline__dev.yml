name: CI Pipeline - DEV
on:
  workflow_dispatch:
  push:
    branches:
      - dev

jobs:
  deploy-dev:
    uses: ./.github/workflows/ci-pipeline.yml
    with:
      git_branch          : 'dev'
      release_type        : 'minor'
      should_increment_tag: true
      should_publish_pypi       : true          # every dev push is on PyPI as X.Y.N (N > 0: a dev build), the same
                                                # version as its GitHub tag; main publishes the releases (X.Y.0)
      should_publish_dockerhub  : false
    secrets: inherit
