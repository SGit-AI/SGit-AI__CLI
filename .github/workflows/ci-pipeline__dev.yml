name: CI Pipeline - DEV
on:
  workflow_dispatch:
  push:
    branches:
      - dev

jobs:
  deploy-dev:
    uses: ./.github/workflows/ci-pipeline.yml
    with:
      git_branch          : 'dev'
      release_type        : 'minor'
      should_increment_tag: true
      should_publish_pypi       : true          # every dev push is on PyPI as a pre-release (X.Y.Z.dev0):
      pypi_prerelease           : true          # `pip install --pre sgit-ai`; a plain install stays on main's release
      should_publish_dockerhub  : false
    secrets: inherit
