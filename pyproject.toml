[tool.poetry]
name        = "sgit-ai"
version     = "v0.15.5"
description = "sgit — git for encrypted vaults. Clone, commit, branch and merge files encrypted client-side (AES-256-GCM) before they leave your machine."
readme      = "README.md"
license     = "Apache-2.0"
authors     = ["The Cyber Boardroom"]
keywords    = ["sgit", "sgit-ai", "vault", "encryption", "cli", "sync",
               "zero-knowledge", "end-to-end-encryption", "version-control",
               "ai-agents", "agent-memory", "aes-256-gcm"]
homepage    = "https://sgit.ai"
repository  = "https://github.com/SGit-AI/SGit-AI__CLI"
documentation = "https://sgit.ai/docs/"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Version Control",
    "Topic :: System :: Archiving :: Mirroring",
    "License :: OSI Approved :: Apache Software License",
]
packages = [{ include = "sgit_ai" }]

[tool.poetry.urls]
"Documentation"  = "https://sgit.ai/docs/"
"Quickstart"     = "https://sgit.ai/docs/quickstart.html"
"For AI agents"  = "https://sgit.ai/llms.txt"
"Why it exists"  = "https://sgit.ai/why/"
"Issues"         = "https://github.com/SGit-AI/SGit-AI__CLI/issues"

[tool.poetry.dependencies]
python       = ">=3.11"
osbot-utils  = ">=3.70.0"
cryptography = ">=43.0.0"

[tool.poetry.group.dev.dependencies]
pytest       = ">=8.0"
pytest-cov   = ">=5.0"
pytest-xdist = ">=3.5"

[tool.poetry.scripts]
sgit-ai = "sgit_ai.cli:main"
sgit    = "sgit_ai.cli:main"

[build-system]
requires      = ["poetry-core>=1.9.1"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths        = ["tests"]
addopts          = "-v --tb=short --ignore=tests/qa"
python_files     = "test_*.py"
python_classes   = "Test_*"
python_functions = "test_*"
markers          = [
    "qa: end-to-end QA scenario tests (in-memory, no external server required)",
    "no_parallel: tests that must NOT run under pytest-xdist (e.g. shared global state, fixed paths, port binds). CI runs these in a separate serial pass.",
]

[tool.coverage.run]
source = ["sgit_ai"]
omit   = ["tests/*"]

[tool.coverage.report]
show_missing = true