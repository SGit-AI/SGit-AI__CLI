name: "Run Pytest Tests"
description: "Install package with dev extras and run pytest with coverage"

inputs:
  test_target:
    description: "Test directory to run"
    required: false
    default: "tests/unit"
  python_version:
    description: "Python version to use"
    required: false
    default: "3.11"
  parallel:
    description: "Run tests in parallel with pytest-xdist (-n auto)"
    required: false
    default: "true"
  extra_packages:
    description: "Additional pip packages to install (space-separated)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ inputs.python_version }}

    - name: Install package and dev dependencies
      shell: bash
      env:                                    # inputs reach the shell as data, never as script text
        EXTRA_PACKAGES: ${{ inputs.extra_packages }}
      run: |
        set -f                                # split on spaces, no globbing; quotes are not parsed
        pip install -e . pytest pytest-cov pytest-xdist coverage $EXTRA_PACKAGES

    - name: Run tests with coverage (parallel pass — no_parallel excluded)
      if: inputs.parallel == 'true'
      shell: bash
      env:
        TEST_TARGET: ${{ inputs.test_target }}
      run: |
        set -f
        coverage run --source=sgit_ai -m pytest -v -s --durations=0 \
          -n auto -m "not no_parallel" $TEST_TARGET

    - name: Run tests with coverage (serial pass — no_parallel only)
      if: inputs.parallel == 'true'
      shell: bash
      env:
        TEST_TARGET: ${{ inputs.test_target }}
      run: |
        # exit code 5 = no tests collected (none marked no_parallel); treat as success
        set -f
        set +e
        coverage run --source=sgit_ai --append -m pytest -v -s --durations=0 \
          -m no_parallel $TEST_TARGET
        rc=$?
        set -e
        if [ $rc -ne 0 ] && [ $rc -ne 5 ]; then
          exit $rc
        fi
        coverage report
        coverage xml

    - name: Run tests with coverage (sequential)
      if: inputs.parallel != 'true'
      shell: bash
      env:
        TEST_TARGET: ${{ inputs.test_target }}
      run: |
        set -f
        coverage run --source=sgit_ai -m pytest -v -s --durations=0 \
          $TEST_TARGET
        coverage report
        coverage xml
