name: CI Pipeline (Base)

on:
  workflow_call:
    inputs:
      git_branch:
        required: true
        type: string
      release_type:
        required: false
        type: string
        default: ""
      should_increment_tag:
        required: false
        type: boolean
        default: false
      should_publish_pypi:
        required: false
        type: boolean
        default: false
      should_publish_dockerhub:
        required: false
        type: boolean
        default: false

env:
  PACKAGE_NAME: 'sgit_ai'
  GIT__BRANCH : ${{ inputs.git_branch }}

jobs:
  run-tests:
    name: "Run Unit Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: "run-tests"
        uses: ./.github/actions/pytest__run-tests
        with:
          test_target: "tests/unit"
          parallel: "true"

  run-integration-tests:
    name: "Run Integration Tests"
    runs-on: ubuntu-latest
    needs: [run-tests]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: "run-integration-tests"
        uses: ./.github/actions/pytest__run-tests
        with:
          test_target: "tests/integration"
          python_version: "3.12"
          parallel: "false"
          extra_packages: "sgraph-ai-app-send"

  run-qa-tests:
    name: "Run QA Scenario Tests"
    runs-on: ubuntu-latest
    needs: [run-tests]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: "run-qa-tests"
        uses: ./.github/actions/pytest__run-tests
        with:
          test_target: "-m qa tests/qa"
          python_version: "3.11"
          parallel: "false"

  run-mutation-tests:
    name: "Run Mutation Tests"
    runs-on: ubuntu-latest
    needs: [run-tests]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0        # worktree needs full history

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run mutation suite
        run: python tests/mutation/run_mutations.py --report mutation-report.json

      - name: Upload mutation report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-report
          path: mutation-report.json

  increment-tag:
    name: Increment Tag
    runs-on: ubuntu-latest
    needs: [run-tests, run-integration-tests, run-qa-tests, run-mutation-tests]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Increment Tag
        if: inputs.should_increment_tag
        uses: owasp-sbot/OSBot-GitHub-Actions/.github/actions/git__increment-tag@c2af482d73aaad222f7e6b091d35ab1e5c116f3b # dev
        with:
          release_type: ${{ inputs.release_type }}

  publish-to-pypi:
    if: inputs.should_publish_pypi && needs.increment-tag.result == 'success'
    name: "Publish to: PYPI"
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    needs: [increment-tag]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Git Update Current Branch
        uses: owasp-sbot/OSBot-GitHub-Actions/.github/actions/git__update_branch@c2af482d73aaad222f7e6b091d35ab1e5c116f3b # dev
      - name: publish-to-pypi
        uses: owasp-sbot/OSBot-GitHub-Actions/.github/actions/pypi__publish@c2af482d73aaad222f7e6b091d35ab1e5c116f3b # dev

  publish-to-dockerhub:
    if: inputs.should_publish_dockerhub && needs.publish-to-pypi.result == 'success'
    name: "Publish to: Docker Hub"
    runs-on: ubuntu-latest
    needs: [publish-to-pypi]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Git Update Current Branch
        uses: owasp-sbot/OSBot-GitHub-Actions/.github/actions/git__update_branch@c2af482d73aaad222f7e6b091d35ab1e5c116f3b # dev

      - name: Build wheel
        run: |
          pip install --quiet build
          python -m build --wheel --outdir docker/dist/

      - name: Read version from wheel
        id: version
        run: |
          WHL=$(ls docker/dist/sgit_ai-*.whl | head -1)
          VER=$(basename "$WHL" | cut -d'-' -f2)
          echo "tag=v${VER}" >> $GITHUB_OUTPUT
          echo "Detected version: v${VER}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./docker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            diniscruz/sgit-ai:latest
            diniscruz/sgit-ai:${{ steps.version.outputs.tag }}
